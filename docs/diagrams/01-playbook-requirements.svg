<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="100%" height="100%" fill="#1e1e1e"/><g fill="#f2f2f2" font-family="monospace" font-size="24"><text x="35" y="55">Story – Tines</text><text x="35" y="100" fill="#55c7e8">Create</text><text x="160" y="100">detection in LimaCharlie – Detect HackTool &gt; Tines &gt; Slack &amp; Email</text><text x="35" y="165">Slack &amp; Email will contain</text><text x="55" y="210">- Time</text><text x="55" y="250">- Computer Name</text><text x="55" y="290">- Source IP</text><text x="55" y="330">- Process</text><text x="55" y="370">- Command Line</text><text x="55" y="410">- File Path</text><text x="55" y="450">- Sensor ID</text><text x="55" y="490">- Link to the detection (if applicable)</text><text x="35" y="555">Tines &gt; Prompt User to isolate the machine (Yes/No)</text><text x="55" y="595" fill="#55c7e8">- if yes:</text><text x="205" y="595">isolate the machine and notify Slack</text><text x="55" y="630" fill="#55c7e8">- if no:</text><text x="205" y="630">do not isolate; investigate</text></g></svg>